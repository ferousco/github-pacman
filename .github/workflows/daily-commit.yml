name: Update activity log

on:
  schedule:
    # Once a day at 12:00 UTC.
    - cron: "0 12 * * *"
  workflow_dispatch:

jobs:
  commit:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Append entries
        run: |
          git config user.name "Ferousco"
          git config user.email "247435076+Ferousco@users.noreply.github.com"

          # Vary the message so the log does not read as one line repeated.
          MESSAGES=(
            "chore: append activity entry"
            "chore: record daily entry"
            "chore: update activity log"
            "chore: log run output"
            "chore: refresh activity log"
          )

          COUNT=$(( (RANDOM % 3) + 1 ))
          echo "Appending $COUNT entr(ies)"

          for i in $(seq 1 "$COUNT"); do
            echo "$(date -u '+%Y-%m-%dT%H:%M:%SZ') - activity $i" >> activity.log
            git add activity.log
            git commit -m "${MESSAGES[$RANDOM % ${#MESSAGES[@]}]}"
            sleep 2
          done

      - name: Push changes
        run: git push
